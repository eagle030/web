<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список форм</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4 text-center">Список форм</h1>
        <div class="d-flex justify-content-end mb-3">
            <a href="{{ url_for('create') }}" class="btn btn-primary">Создать новую форму</a>
        </div>
        {% if forms %}
        <table class="table table-bordered table-striped shadow-sm bg-white">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Имя</th>
                    <th>Email</th>
                    <th>Категория</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                {% for form in forms %}
                <tr>
                    <td>{{ form.id }}</td>
                    <td>{{ form.name }}</td>
                    <td>{{ form.email }}</td>
                    <td>{{ form.category }}</td>
                    <td>
                        <a href="{{ url_for('view', form_id=form.id) }}" class="btn btn-sm btn-info text-white">Просмотр</a>
                        <a href="{{ url_for('edit', form_id=form.id) }}" class="btn btn-sm btn-warning">Редактировать</a>
                        <a href="{{ url_for('delete', form_id=form.id) }}" class="btn btn-sm btn-danger">Удалить</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
            <p class="text-muted text-center">Форм пока нет. Создайте первую!</p>
        {% endif %}
    </div>
</body>
</html>
