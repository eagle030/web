<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать форму</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow p-4">
            <h1 class="mb-4">Редактировать форму</h1>
            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Имя</label>
                    <input type="text" name="name" value="{{ form.name }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" value="{{ form.email }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Категория</label>
                    <select name="category" class="form-select">
                        <option value="A" {% if form.category == "A" %}selected{% endif %}>Категория A</option>
                        <option value="B" {% if form.category == "B" %}selected{% endif %}>Категория B</option>
                        <option value="C" {% if form.category == "C" %}selected{% endif %}>Категория C</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success">Сохранить</button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Назад</a>
            </form>
        </div>
    </div>
</body>
</html>
